[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-sandbox"
version = "1.0.0"
description = "AST-based secure Python code execution sandbox. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "hussain-alsaibai"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = ["sandbox", "security", "ast", "execute", "untrusted", "code"]
dependencies = []

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-sandbox"
Repository = "https://github.com/hussain-alsaibai/tiny-sandbox"

[tool.setuptools.packages.find]
include = ["tiny_sandbox*"]

[tool.ruff]
exclude = ["__pycache__", ".venv", "build", "dist", ".pytest_cache"]
# Lint rules are declared explicitly so the CI result does not depend on
# whichever ruff release pip happens to install that day. Without an explicit
# `select`, ruff 0.17 enables rules such as FA100 and PIE790 that fail this
# codebase on every Python version in the matrix.
lint.select = ["E", "F", "W", "I", "B"]
lint.ignore = ["E501"]
