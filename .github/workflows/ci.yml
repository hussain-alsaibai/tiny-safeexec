name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no setup-python build of
    # 3.8/3.9 - those matrix rows die before a test runs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: |
          pip install pytest "ruff==0.17.2"
          # The tests import the package by name, so install it first.
          pip install -e .
      - name: Lint
        run: ruff check . --ignore E501
      - name: Test
        run: pytest tests/ -q
